name: Deploy Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        type: choice
        options:
          - dev
          - prod
      ansible_tags:
        description: "Ansible tags to run (e.g. deployments, common, user-mgmt)"
        required: false
        default: deployments
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Plan — ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      TF_IN_AUTOMATION: "true"

    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exit_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.4"

      - name: Write tfvars
        working-directory: terraform
        env:
          TFVARS_CONTENT: ${{ secrets.TFVARS_CONTENT }}
        run: |
          printf '%s' "$TFVARS_CONTENT" > ${{ inputs.environment }}.tfvars

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Select workspace
        working-directory: terraform
        run: |
          terraform workspace select ${{ inputs.environment }} \
            || terraform workspace new ${{ inputs.environment }}

      - name: Terraform Plan
        id: plan
        working-directory: terraform
        run: |
          terraform plan \
            --var-file=${{ inputs.environment }}.tfvars \
            -detailed-exitcode \
            -out=tfplan
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Fail on plan error
        if: steps.plan.outputs.exit_code == '1'
        run: exit 1

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}
          path: terraform/tfplan
          retention-days: 1

  apply:
    name: Apply — ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: plan
    environment: ${{ inputs.environment }}
    if: needs.plan.outputs.plan_exit_code == '2'

    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.4"

      - name: Write tfvars
        working-directory: terraform
        env:
          TFVARS_CONTENT: ${{ secrets.TFVARS_CONTENT }}
        run: |
          printf '%s' "$TFVARS_CONTENT" > ${{ inputs.environment }}.tfvars

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Select workspace
        working-directory: terraform
        run: |
          terraform workspace select ${{ inputs.environment }} \
            || terraform workspace new ${{ inputs.environment }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}
          path: terraform/

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply tfplan

  ansible:
    name: Ansible — ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [plan, apply]
    environment: ${{ inputs.environment }}
    # Run when plan succeeded and apply either succeeded or was skipped (no infra changes).
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (needs.apply.result == 'success' || needs.apply.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible and Python dependencies
        run: |
          pip install --upgrade pip
          pip install ansible boto3 botocore kubernetes jmespath netaddr PyMySQL passlib

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install \
            amazon.aws \
            community.aws \
            kubernetes.core \
            community.general

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name main-${{ inputs.environment }} \
            --region ${{ vars.AWS_REGION }}

      - name: Set up SSH key for EC2 access
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Write Ansible environment group vars
        working-directory: ansible
        env:
          ANSIBLE_VARS_CONTENT: ${{ secrets.ANSIBLE_VARS_CONTENT }}
        run: |
          printf '%s' "$ANSIBLE_VARS_CONTENT" \
            > inventories/${{ inputs.environment }}/group_vars/${{ inputs.environment }}.yml

      - name: Run Ansible playbook
        working-directory: ansible
        run: |
          ansible-playbook \
            -i inventories/${{ inputs.environment }} \
            site.yml \
            --tags "${{ inputs.ansible_tags }}"
