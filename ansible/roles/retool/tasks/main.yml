---
- name: Generate encryptionKey for retool
  community.aws.secretsmanager_secret:
    name: "bi-retool-encryptionkey-{{ project }}-{{ env }}"
    state: present
    secret_type: 'string'
    secret: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits,hexdigits,octdigits') }}"
    region: "{{ aws_region }}"
  when:
    - not lookup('amazon.aws.aws_secret', 'bi-retool-encryptionkey-' + project + '-' + env, region=aws_region, on_missing='skip', on_deleted='skip')

- name: Generate jwtSecret for retool
  community.aws.secretsmanager_secret:
    name: "bi-retool-jwtsecret-{{ project }}-{{ env }}"
    state: present
    secret_type: 'string'
    secret: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits,hexdigits,octdigits') }}"
    region: "{{ aws_region }}"
  when:
    - not lookup('amazon.aws.aws_secret', 'bi-retool-jwtsecret-' + project + '-' + env, region=aws_region, on_missing='skip', on_deleted='skip')

- name: Deploy retool-pgdb
  kubernetes.core.helm:
    name: retool-pgdb
    chart_ref: bitnami/postgresql
    release_namespace: bi
    create_namespace: false
    update_repo_cache: true
    chart_version: '12.10.0'
    values: "{{ lookup('template', 'postgresql-value.yaml.j2') | from_yaml }}"
    kubeconfig: "~/.kube/{{ project }}-eks-main-{{ env }}"

- name: Add retool repository
  kubernetes.core.helm_repository:
    name: retool
    repo_url: "https://charts.retool.com"

- name: Deploy retool
  kubernetes.core.helm:
    name: retool
    chart_ref: retool/retool
    release_namespace: bi
    create_namespace: false
    update_repo_cache: true
    chart_version: '6.0.4'
    values: "{{ lookup('template', 'retool-value.yaml.j2') | from_yaml }}"
    kubeconfig: "~/.kube/{{ project }}-eks-main-{{ env }}"
