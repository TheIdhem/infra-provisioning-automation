---
- hosts: all
  gather_facts: true
  become: true
  roles:
    - role: common
      tags: common
    - role: kernel
      tags:
        - kernel
        - never
    - role: user-mgmt
      tags: user-mgmt

- hosts: localhost
  gather_facts: true
  tasks:
    - name: add localhost to inventory
      add_host:
        name: "{{ inventory_hostname }}"
        groups:
          - "{{ ansible_inventory_sources[0] | basename }}"
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      tags: always
    - name: Get the current caller identity information
      aws_caller_info:
      register: aws_caller_info
      tags: always

- hosts: localhost
  gather_facts: true
  roles:
    - role: unagi-ca
      tags: unagi-ca
    - role: monitoring
      tags: monitoring
    - role: rabbitmq
      tags: rabbitmq
    - role: storage-service
      tags: storage-service
    - role: third-parties
      tags: third-parties
    - role: notification-service
      tags: notification-service
    - role: datacore
      tags: datacore
    - role: msgc
      tags: msgc
    - role: agora-token-service
      tags: agora-token-service
    - role: ingress-nginx-memcached
      tags: ingress-nginx-memcached
    - role: support
      tags: support
      when: env == 'prod'
    - role: website
      tags: website
      when: env == 'prod'
    - role: metabase
      tags:
        - metabase
        - bi
      when: env == 'prod'
    - role: retool
      tags:
        - retool
        - bi
      when: env == 'prod'
    - role: chatbot
      tags: chatbot
  tags: deployments
